name: Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: model-square
            image: sub2api-extra-pages-model-square
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - app: model-square
            image: sub2api-extra-pages-model-square
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - app: document-viewer
            image: sub2api-extra-pages-document-viewer
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - app: document-viewer
            image: sub2api-extra-pages-document-viewer
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/yuzukumo/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    strategy:
      matrix:
        include:
          - app: model-square
            image: sub2api-extra-pages-model-square
          - app: document-viewer
            image: sub2api-extra-pages-document-viewer
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.app }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish
        env:
          IMAGE: ghcr.io/yuzukumo/${{ matrix.image }}
        run: |
          cd /tmp/digests
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE}:latest" "${refs[@]}"
