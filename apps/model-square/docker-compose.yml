services:
  sub2api-extra-modelsquare:
    container_name: sub2apiextra-modelsquare
    image: ghcr.io/yuzukumo/sub2api-extra-pages-model-square:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:3000"
    environment:
      TZ: Asia/Singapore
      NOTICE_MESSAGE: "Model availability and pricing are subject to change."
      SUB2API_URL: "http://sub2api:8080"
      SUB2API_ADMIN_API_KEY: ""
    volumes:
      - sub2apiextra-modelsquare-data:/app/data

volumes:
  sub2apiextra-modelsquare-data:
